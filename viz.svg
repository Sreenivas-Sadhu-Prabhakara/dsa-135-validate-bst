<text x="56.0" y="523.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Equivalent check: the inorder traversal must be strictly increasing. Both are O(n);</text>
<text x="56.0" y="542.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">the window version fails faster and allocates nothing.</text>
